<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee0fa"><title>Prova pagamenti Premium</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f6edff;color:#53356d;margin:0;padding:24px}.card{max-width:480px;margin:40px auto;background:white;border-radius:26px;padding:26px;box-shadow:0 8px 35px #7d55aa22}h1{font-size:24px}label{display:block;margin:18px 0 6px;font-weight:650}input{box-sizing:border-box;width:100%;padding:15px;border:1px solid #d5c2e9;border-radius:13px;font-size:16px}button{border:0;border-radius:25px;background:#8743c4;color:white;padding:15px 24px;font-size:16px;font-weight:700;margin-top:18px;width:100%}button:disabled{opacity:.55}#status{margin-top:18px;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#776887;font-size:14px}</style></head><body><main class="card"><h1>💜 Premium Famiglia</h1><p>Verifica del pagamento nell'ambiente di prova. Non vengono effettuati addebiti reali.</p><form id="login"><label for="email">Email dell'account di prova</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton">Accedi per la prova</button></form><section id="ready" hidden><p>Accesso effettuato. Puoi aprire il pagamento di prova.</p><button id="checkout">Apri Stripe Sandbox</button></section><p id="status" role="status"></p><p class="muted">Pagina indipendente dall'inventario. L'app definitiva non viene modificata.</p></main><script>(()=>{'use strict';const base='https://akuonoghksfjsrwhaxhs.supabase.co',key='sb_publishable_c_31PwX0vyR4Ym8AEg5U6g_NlBDhE82';const el=id=>document.getElementById(id);let accessToken='';const status=t=>el('status').textContent=t;async function request(url,options={}){const response=await fetch(base+url,{...options,headers:{apikey:key,...options.headers}});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error_description||data.msg||data.message||data.error||'HTTP '+response.status);return data}el('login').addEventListener('submit',async event=>{event.preventDefault();const button=el('loginButton');button.disabled=true;status('Verifica accesso…');try{const data=await request('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:el('email').value.trim(),password:el('password').value})});accessToken=data.access_token;el('password').value='';el('login').hidden=true;el('ready').hidden=false;status('Accesso riuscito.');}catch(error){status('Accesso: '+error.message)}finally{button.disabled=false}});el('checkout').addEventListener('click',async()=>{const button=el('checkout');button.disabled=true;status('Collegamento a Stripe…');try{const data=await request('/functions/v1/stripe-create-checkout',{method:'POST',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:'{}'});const url=data.url||data.checkout_url;if(typeof url!=='string'||!url.startsWith('https://checkout.stripe.com/'))throw Error('Il server non ha restituito un URL Stripe Checkout valido');location.assign(url)}catch(error){status('Stripe Sandbox: '+error.message);button.disabled=false}})})();</script></body></html>
